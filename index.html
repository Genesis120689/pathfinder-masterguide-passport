 $('#root').innerHTML=`<div class="hero admin-hero-v11" aria-label="Administrator dashboard banner"><div class="admin-hero-shine"></div><div class="admin-hero-copy"><div class="tagline">DIVISION &amp; ORGANIZATION MANAGEMENT</div><h1>Administrator Dashboard</h1><p>Manage clubs, accounts, official news, calendars and compliance oversight.</p><div class="admin-hero-links"><span>♧ Clubs &amp; Members</span><span>▤ Master Guides</span><span>◁ Announcements</span></div></div><div class="admin-hero-portrait"><img src="/assets/master_guide_dashboard_portrait.webp" alt="Master Guide leader at an outdoor activity"></div><div class="admin-hero-brand"><img src="/assets/approved_main_logo.webp" alt="Pathfinder and Master Guide Digital Passport logo"></div></div><div class="admin-layout"><div class="admin-main"><section class="panel"><div class="row"><h2><span class="heading-mark">▥</span> System Overview</h2><span class="pill">Management workspace</span></div><div class="admin-stats">${stats.map(([name,val],i)=>`<div class="admin-stat"><div class="stat-symbol" aria-hidden="true">${["♣","♟","☑","⚑","★","◈"][i]}</div><div class="stat-numbers"><span>${name}</span><strong>${Number(val||0).toLocaleString()}</strong></div></div>`).join('')}</div><p class="small">The technical administrator does not hold an automatic Master Guide enrolment and cannot approve personal requirements or confer certification. Authorization remains with designated church leadership.</p></section><section class="panel"><h2>Organization & Accounts</h2>${management()}</section><section class="panel"><h2>Administration Guidance</h2><p>Use separately assigned Division, Mission, pastor and club roles for formal church approvals. Keep technical administration distinct from investiture authorization.</p><p class="small">Curriculum content is a condensed overview and requires final review against the approved manuals before formal use.</p></section></div>${communityPanels()}</div>`;
 bindForms();bindCommunity();
}


function switchWorkspace(where){WORKSPACE=where;render()}
function renderOfficerWorkspace(){
 $('#account').innerHTML=`<span class="small">${escapeHtml(ME.name)} · ${escapeHtml(ME.role)}</span> <button class="alt" onclick="run(async()=>{await api('logout',{});location.href='/'})">Sign out</button>`;
 $('#root').innerHTML=`<div class="hero"><img class="hero-photo" src="/assets/approved_main_logo.webp" alt="Pathfinder and Master Guide Passport official artwork"><div class="hero-copy"><div class="tagline">ORGANIZATION WORKSPACE</div><h1>${escapeHtml(ME.name)}</h1><p>Club oversight, account creation, announcements, and event calendar.</p></div></div><div class="admin-layout"><div class="admin-main"><section class="panel"><div class="row"><h2>Director / Officer Workspace</h2><button class="alt" onclick="switchWorkspace('passport')">My Digital Passport</button></div><p>Manage only your authorized scope. Personal class requirements are kept in a separate workspace.</p></section>${management()}</div>${communityPanels()}</div>`;
 bindForms();bindCommunity();
}

function render(){if(ME.role==='admin'){renderAdmin();return}if(['director','mission','mission_youth_director','pastor','ssd','ssd_youth_director','ssd_pathfinder_director'].includes(ME.role)&&WORKSPACE==='management'){renderOfficerWorkspace();return}$('#account').innerHTML=`<span class="small">${escapeHtml(ME.name)} · ${escapeHtml(ME.role)}</span> <button class="alt" onclick="run(async()=>{await api('logout',{});location.href='/'})">Sign out</button>`;let approved=Object.values(P.progress).filter(x=>x.level===FOCUS.level&&x.status==='completed').length,total=Object.values(CAT.requirements[FOCUS.level]).reduce((s,a)=>s+a.length,0),pct=Math.round(approved/Math.max(1,total)*100);let mg=P.approvals.filter(x=>x.kind==='mg').map(x=>x.stage);let cls=CLUBS.find(x=>x.id===FOCUS.club_id);$('#root').innerHTML=`<div class="hero"><img class="hero-photo" src="/assets/approved_main_logo.webp" alt="Pathfinder and Master Guide Passport official artwork"><div class="hero-copy"><div class="tagline">DIGITAL GREEN CARD · ONLINE TRACKING</div><h1>Grow. Serve. Lead.</h1><p>Pathfinder Classes · Master Guide Journey · Verified Investiture Records</p></div></div><div class="layout"><aside><section class="panel"><h2>My workspace</h2>${['director','mission','mission_youth_director','pastor','ssd','ssd_youth_director','ssd_pathfinder_director'].includes(ME.role)?`<button class="navbtn" onclick="switchWorkspace('management')">⚙ Management Workspace</button>`:''}<button class="navbtn active" onclick="document.getElementById('passport').scrollIntoView({behavior:'smooth'})">▤ Digital Passport</button><button class="navbtn" onclick="document.getElementById('records').scrollIntoView({behavior:'smooth'})">▥ Approvals & QR</button>${isManager()?`<button class="navbtn" onclick="document.getElementById('manage').scrollIntoView({behavior:'smooth'})">♧ Club Management</button>`:''}<div class="divider"></div><div class="small">SIGNED IN AS</div><b>${escapeHtml(ME.role.toUpperCase())}</b></section><section class="panel"><h3>Members visible to you</h3><select id="member" onchange="run(()=>changeMember(this.value))">${USERS.map(x=>`<option value="${x.id}" ${x.id===FOCUS.id?'selected':''}>${escapeHtml(x.name)} · ${escapeHtml(x.level)}</option>`).join('')}</select><p class="small">Club boundaries are enforced by the server.</p></section><section class="panel"><h3>Master Guide Identity</h3><div class="logo-placeholder"><img id="mg-logo" src="/assets/master_guide_logo.png" alt="Master Guide emblem" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none">✦ Master Guide emblem slot<br><small>Upload the official PNG/JPG using the form below</small></span></div>${canPublishAnnouncements()?`<form id="logoUpload" class="stack" style="margin-top:12px"><input type="file" name="logo" accept="image/png,image/jpeg,image/webp" required><button>Upload official MG logo</button></form>`:``}</section><section class="panel"><h3>Official References</h3>${Object.entries(CAT.sources).map(([k,v])=>`<div style="padding:5px 0"><a href="${v}" target="_blank" rel="noopener noreferrer">${escapeHtml(k)} ↗</a></div>`).join('')}</section></aside><div><section id="passport" class="panel"><div class="row"><div><div class="small">${escapeHtml(cls?.name||'Unassigned club')}</div><h2>${escapeHtml(FOCUS.name)}</h2><div class="muted">${escapeHtml(FOCUS.level)} · ${escapeHtml(FOCUS.role)}</div></div><span class="pill ${FOCUS.certified?'completed':''}">${FOCUS.certified?'✓ Certified Master Guide':'Passport Active'}</span></div>${FOCUS.certified?`<div class="ok" style="margin:16px 0"><b>🎉 Congratulations! You are now a Certified Master Guide.</b><p>You may serve as an authorized mentor; director appointment requires separate approvals.</p></div>`:''}<div class="grid" style="margin:18px 0"><div class="stat"><div class="small">Requirements Approved</div><strong>${approved} / ${total}</strong></div><div class="stat"><div class="small">Completion</div><strong>${pct}%</strong></div><div class="stat"><div class="small">Pending</div><strong>${P.progress.filter(x=>x.level===FOCUS.level&&x.status==='pending').length}</strong></div></div><div class="progress"><span style="width:${pct}%"></span></div><p class="small">Curriculum checklist is a condensed overview, not a complete certified reproduction of the GC manual. Consult source links for full requirements, alternatives and Advanced tracks.</p>${Object.entries(CAT.requirements[FOCUS.level]).map(([section,items])=>`<details><summary>${escapeHtml(section)} · ${items.filter((_,i)=>status(section+'|'+i)==='completed').length}/${items.length}</summary><div class="inside">${items.map((item,i)=>{let k=section+'|'+i,s=status(k);return `<div class="item"><div><b>${escapeHtml(item)}</b><div style="margin-top:7px"><span class="pill ${s}">${s.replace('_',' ').toUpperCase()}</span></div></div><div class="actions">${(FOCUS.id===ME.id||isManager())&&s!=='pending'&&s!=='completed'?`<button class="alt" onclick="run(()=>setStatus('${escapeHtml(k)}','pending'))">Submit Pending</button>`:''}${canApprove()&&s!=='completed'?`<button onclick="run(()=>setStatus('${escapeHtml(k)}','completed'))">✓ Approve</button>`:''}${(canApprove()||FOCUS.id===ME.id)&&s!=='not_started'?`<button class="alt" onclick="run(()=>setStatus('${escapeHtml(k)}','not_started'))">Reset</button>`:''}</div></div>`}).join('')}</div></details>`).join('')}</section><section id="records" class="panel"><h2>QR Passport & Approvals</h2><div class="row"><div><img class="qr" src="/api/qr/${FOCUS.id}" alt="QR code for club member passport"><p class="small">Signed verification URL. Scanner must log in and have permission to view the record.</p></div><div style="flex:1;min-width:210px"><h3>Master Guide Investiture</h3><p class="small">Each approval is recorded. Final recognition requires a recorded investiture.</p>${['pastor','director','mission','investiture'].map(s=>`<div class="row" style="padding:7px 0;border-bottom:1px solid #edf2ed"><b>${s==='investiture'?'Investiture Recorded':s.toUpperCase()+' Approved'}</b><span class="pill ${mg.includes(s)?'completed':'pending'}">${mg.includes(s)?'Approved':'Pending'}</span>${FOCUS.level==='Master Guide'&&!mg.includes(s)&&((ME.role===s)||(s==='investiture'&&ME.role==='mission'))?`<button onclick="run(()=>approve('${s}'))">Confirm</button>`:''}</div>`).join('')}</div></div>${FOCUS.level==='Guide'&&['director','admin','ssd'].includes(ME.role)?`<button onclick="run(enrollMG)">Enroll as Master Guide Trainee</button>`:''}${FOCUS.certified?`<div class="divider"></div><h3>Club Director Appointment</h3><p class="small">Pastor recommendation → Mission approval → SSD confirmation. Director access begins after Mission approval; SSD status records final oversight.</p>${['pastor','mission','ssd'].map(s=>`<div class="row" style="margin:10px 0"><span>${s.toUpperCase()}</span><span class="pill ${P.appointments.some(x=>x.stage===s)?'completed':'pending'}">${P.appointments.some(x=>x.stage===s)?'Recorded':'Awaiting'}</span>${(ME.role===s)&&!P.appointments.some(x=>x.stage===s)?`<button onclick="run(()=>appoint('${s}'))">Confirm</button>`:''}</div>`).join('')}`:''}</section>${isManager()?management():''}<div class="alert">Security notice: protect member information and use authorized approvals only. Full SSD deployment requires verified curriculum, tested controls, hosting and backups.</div></div>${communityPanels()}</div>`;bindForms();bindCommunity()}
function status(key){return P.progress.find(x=>x.req_key===key&&x.level===FOCUS.level)?.status||'not_started'}
async function changeMember(id){FOCUS=USERS.find(x=>x.id===Number(id));P=await api('progress/'+FOCUS.id);history.replaceState(null,'','/?user='+FOCUS.id);render()}
async function setStatus(req_key,status){if(status==='completed'&&!confirm('Approve this requirement as an authorized mentor/director?'))return;await api('progress',{user_id:FOCUS.id,level:FOCUS.level,req_key,status});toast('Saved: '+status);await refresh()}
async function approve(stage){if(!confirm('Record '+stage+' approval for '+FOCUS.name+'? This action is logged.'))return;await api('approval',{user_id:FOCUS.id,stage});toast('Approval recorded');await refresh()}
async function appoint(stage){if(!confirm('Approve '+stage+' director appointment stage?'))return;await api('appointment',{user_id:FOCUS.id,stage});toast('Appointment updated');await refresh()}
async function enrollMG(){if(!confirm('Change this Guide Pathfinder into Master Guide Trainee?'))return;await api('enroll-mg',{user_id:FOCUS.id});toast('Master Guide enrolment created');await refresh()}
function management(){return `<section class="panel" id="manage"><h2>Club Management</h2>${['admin','ssd'].includes(ME.role)?`<h3>Create Club</h3><form id="clubForm" class="grid"><input name="name" placeholder="Club name" required><input name="church" placeholder="Local church" required><input name="mission" placeholder="Mission / Conference" required><button>Add club</button></form><div class="divider"></div>`:''}${['admin','ssd','director'].includes(ME.role)?`<h3>Create Member Account</h3><form id="newUser" class="grid"><input name="name" placeholder="Full name" required><input name="username" placeholder="Username" required><input name="password" placeholder="Temporary password, 10+ chars" minlength="10" required><select name="role">${(ME.role==='director'?['pathfinder','trainee']:['pathfinder','trainee','masterguide','director','pastor','mission','ssd']).map(x=>`<option value="${x}">${x}</option>`).join('')}</select><select name="level">${['Friend','Companion','Explorer','Ranger','Voyager','Guide','Master Guide'].map(x=>`<option>${x}</option>`).join('')}</select><select name="club_id">${CLUBS.filter(x=>ME.role!=='director'||x.id===ME.club_id).map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('')}</select><button>Create account</button></form><p class="small">When creating a Master Guide trainee, set role = trainee and class = Master Guide. Share temporary credentials securely.</p>`:''}${ME.role==='admin'?`<div class="divider"></div><h3>Create Additional Administrator</h3><p class="small">Administrator accounts are separate from Pathfinder and Master Guide requirements. Only existing administrators can create other administrators.</p><form id="addAdmin" class="grid"><input name="name" placeholder="Full name" required minlength="2"><input name="username" placeholder="Admin username" required minlength="3"><input name="password" type="password" placeholder="Strong password (12+ characters)" required minlength="12"><button>Create Administrator</button></form>`:''}<h3>Club Directory</h3>${CLUBS.map(x=>`<p style="margin:7px 0"><b>${escapeHtml(x.name)}</b><span class="small"> · ${escapeHtml(x.church)} · ${escapeHtml(x.mission)}</span></p>`).join('')}</section>`}
function bindForms(){if($('#addAdmin'))$('#addAdmin').onsubmit=e=>{e.preventDefault();run(async()=>{let f=Object.fromEntries(new FormData(e.target));await api('users',{...f,role:'admin',level:'Friend',club_id:null});toast('Additional administrator created');e.target.reset();await refresh()})};if($('#clubForm'))$('#clubForm').onsubmit=e=>{e.preventDefault();run(async()=>{await api('clubs',Object.fromEntries(new FormData(e.target)));toast('Club created');await refresh()})};if($('#newUser'))$('#newUser').onsubmit=e=>{e.preventDefault();run(async()=>{let b=Object.fromEntries(new FormData(e.target));b.club_id=Number(b.club_id);await api('users',b);toast('Account created');await refresh()})}}

// V0.3 Division bulletin, news photo feed, and role-scoped activity calendar.
const SSD_ROLES=['admin','ssd','ssd_youth_director','ssd_pathfinder_director'];
const MISSION_ROLES=['mission','mission_youth_director'];
function canPublishAnnouncements(){return SSD_ROLES.includes(ME.role)}
function canPublishEvents(){return canPublishAnnouncements()||MISSION_ROLES.includes(ME.role)||ME.role==='director'}
function eventAccess(){return canPublishAnnouncements()?['ssd','mission','club']:MISSION_ROLES.includes(ME.role)?['mission','club']:ME.role==='director'?['club']:[]}
function formatDay(str){try{return new Date(str+'Z'.replace('Z','')).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}catch{return str}}
function cardPost(a){return `<article class="news-card">${a.image_path?`<img src="${escapeHtml(a.image_path)}" alt="Announcement photo" loading="lazy">`:`<div class="news-default"><img src="/assets/master_guide_studio.jpg" alt="Master Guide profile image"></div>`}<div class="news-caption"><span class="pill completed">Division Announcement</span><h4>${escapeHtml(a.title)}</h4><p>${escapeHtml(a.body)}</p><small>${escapeHtml(a.author)} · ${formatDay(a.created.slice(0,10))}</small>${canPublishAnnouncements()?`<button class="tiny danger-button" onclick="run(()=>deleteAnnouncement(${a.id}))">Delete post</button>`:''}</div></article>`}
function eventCard(e){let date=new Date(e.starts_at);let month=Number.isNaN(+date)?'—':date.toLocaleDateString('en-PH',{month:'short'});let day=Number.isNaN(+date)?'--':date.getDate();let label=e.scope==='club'?'Private · Club':e.scope==='mission'?'Mission · All members':'Division · All members';return `<article class="event-item"><div class="event-date"><small>${escapeHtml(month)}</small><b>${escapeHtml(day)}</b></div><div class="event-description"><strong>${escapeHtml(e.title)}</strong><p>${escapeHtml(label)}${e.location?' · '+escapeHtml(e.location):''}</p>${e.description?`<p>${escapeHtml(e.description)}</p>`:''}</div>${canPublishAnnouncements()||(e.scope==='mission'&&MISSION_ROLES.includes(ME.role))||(e.scope==='club'&&ME.role==='director'&&ME.club_id===e.club_id)?`<button class="tiny alt" onclick="run(()=>deleteEvent(${e.id}))">×</button>`:''}</article>`}
function communityPanels(){return `<aside class="community-column"><section class="panel"><div class="row"><h2><span class="heading-mark">◁</span> Division Announcements</h2><span class="pill">Official bulletin</span></div>${ANNOUNCEMENTS.length?`<div class="news-list">${ANNOUNCEMENTS.map(cardPost).join('')}</div>`:`<div class="empty-updates"><img src="/assets/approved_main_logo.webp" alt="Pathfinder and Master Guide Passport banner"><div><strong>Pathfinder & Master Guide Updates</strong><p>Official Division announcements and photos will appear here once published.</p></div></div>`}${canPublishAnnouncements()?`<details class="publisher"><summary>＋ Publish announcement</summary><form id="newAnnouncement" class="stack padded"><input name="title" placeholder="Announcement title" maxlength="140" required><textarea name="body" rows="3" placeholder="Announcement / message" maxlength="3000" required></textarea><label class="small">Photo (optional, JPEG/PNG/WebP, up to 3 MB)</label><input type="file" name="photo" accept="image/jpeg,image/png,image/webp"><button>Publish to authorized audience</button></form></details>`:''}</section><section class="panel"><div class="row"><h2><span class="heading-mark">▦</span> Calendar of Activities</h2><span class="pill">${EVENTS.length} events</span></div><p class="small">Division & Mission activities are visible to everyone. Club activities are private to that club.</p><div class="event-list">${EVENTS.length?EVENTS.map(eventCard).join(''):'<p class="muted">No activities posted yet.</p>'}</div>${canPublishEvents()?`<details class="publisher"><summary>＋ Add activity</summary><form id="newEvent" class="stack padded"><input name="title" placeholder="Activity title" maxlength="140" required><textarea name="description" rows="2" placeholder="Activity details"></textarea><label class="small">Start date and time</label><input name="starts_at" type="datetime-local" required><label class="small">End date and time (optional)</label><input name="ends_at" type="datetime-local"><input name="location" placeholder="Venue / location"><label class="small">Who can see it?</label><select name="scope">${eventAccess().map(scope=>`<option value="${scope}">${scope==='club'?'Only my club':scope==='mission'?'All members (Mission announcement)':'All members (Division announcement)'}</option>`).join('')}</select>${canPublishAnnouncements()?`<label class="small">Club (if selecting private club activity)</label><select name="club_id">${CLUBS.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select>`:''}<button>Save activity</button></form></details>`:''}</section></aside>`}
async function deleteAnnouncement(id){if(!confirm('Delete this Division announcement?'))return;let r=await fetch('/api/announcements/'+id,{method:'DELETE'});if(!r.ok)throw Error((await r.json()).detail);toast('Announcement deleted');await refresh()}
async function deleteEvent(id){if(!confirm('Delete this activity?'))return;let r=await fetch('/api/events/'+id,{method:'DELETE'});if(!r.ok)throw Error((await r.json()).detail);toast('Activity deleted');await refresh()}
function bindCommunity(){if($('#logoUpload'))$('#logoUpload').onsubmit=e=>{e.preventDefault();run(async()=>{let photo=e.target.elements.logo.files[0];if(!photo)throw Error('Choose a logo image');if(photo.size>3000000)throw Error('3 MB limit');let image_base64=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(photo)});await api('branding/master-guide-logo',{image_base64});toast('Master Guide emblem updated');await refresh()})};if($('#newAnnouncement'))$('#newAnnouncement').onsubmit=e=>{e.preventDefault();run(async()=>{const form=e.target,photo=form.elements.photo.files[0];let image_base64=null;if(photo){if(photo.size>3000000)throw Error('3 MB picture limit');image_base64=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result.split(',')[1]);reader.onerror=rej;reader.readAsDataURL(photo)})}await api('announcements',{title:form.elements.title.value,body:form.elements.body.value,image_base64});toast('Division announcement published');await refresh()})};if($('#newEvent'))$('#newEvent').onsubmit=e=>{e.preventDefault();run(async()=>{const f=e.target;await api('events',{title:f.elements.title.value,description:f.elements.description.value,starts_at:f.elements.starts_at.value,ends_at:f.elements.ends_at.value||null,location:f.elements.location.value,scope:f.elements.scope.value,club_id:f.elements.club_id?Number(f.elements.club_id.value):null});toast('Activity saved');await refresh()})}}

start();
</script></body></html>
